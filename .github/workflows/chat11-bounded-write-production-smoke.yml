name: Chat 11 Bounded Write Production Smoke

on:
  workflow_dispatch:
    inputs:
      confirm_bounded_write_smoke:
        description: Type RUN-CHAT11-BOUNDED-WRITE-SMOKE to approve isolated production mutations and cleanup
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: bestcode-chat11-bounded-write-production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Verify the task-bound MCP write path
    if: ${{ inputs.confirm_bounded_write_smoke == 'RUN-CHAT11-BOUNDED-WRITE-SMOKE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      BESTCODE_BACKEND_URL: https://best-code-ide.enkhbat194.workers.dev
      BESTCODE_PRODUCTION_WORKERS: >-
        [{"name":"best-code-ide","root_directory":"backend"},{"name":"best-code-ide-appl","root_directory":"frontend"}]
    steps:
      - name: Enforce approved production source
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Chat 11 bounded-write smoke must run from refs/heads/main; got $GITHUB_REF"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Test bounded-write smoke controllers and redaction
        run: >-
          node --test
          scripts/chat11-bounded-write-operation-budget.test.mjs
          scripts/chat11-bounded-write-production-smoke.test.mjs
          scripts/chat11-bounded-write-production-denials.test.mjs
      - name: Require protected production secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BESTCODE_AUTH_TOKEN: ${{ secrets.BESTCODE_AUTH_TOKEN }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID BESTCODE_AUTH_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::GitHub environment production is missing $name or environment access."
              exit 1
            fi
          done
      - name: Require exact main deployment and 100 percent traffic
        id: release_integrity
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          node scripts/cloudflare-release-integrity.mjs
          --repository "$GITHUB_REPOSITORY"
          --branch main
          --expected-sha "$GITHUB_SHA"
          --repair-preview-triggers false
          --wait-seconds 900
          --poll-seconds 20
          --output artifacts/chat11-bounded-write-release-integrity.json
      - name: Run isolated owner-approved bounded-write connector smoke
        env:
          BESTCODE_AUTH_TOKEN: ${{ secrets.BESTCODE_AUTH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node --import ./scripts/chat11-bounded-write-operation-budget.mjs
          scripts/chat11-bounded-write-production-smoke.mjs
          --backend-url "$BESTCODE_BACKEND_URL"
          --repository "$GITHUB_REPOSITORY"
          --expected-sha "$GITHUB_SHA"
          --run-key "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          --output artifacts/chat11-bounded-write-production-smoke.json
      - name: Run supplemental production denial and lease cleanup proof
        if: ${{ always() && steps.release_integrity.outcome == 'success' }}
        env:
          BESTCODE_AUTH_TOKEN: ${{ secrets.BESTCODE_AUTH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/chat11-bounded-write-production-denials.mjs
          --backend-url "$BESTCODE_BACKEND_URL"
          --repository "$GITHUB_REPOSITORY"
          --expected-sha "$GITHUB_SHA"
          --run-key "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          --output artifacts/chat11-bounded-write-production-denials.json
      - name: Scan immutable evidence for secret leaks and required outcomes
        if: always()
        shell: bash
        env:
          BESTCODE_AUTH_TOKEN: ${{ secrets.BESTCODE_AUTH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node -e "
            const fs = require('node:fs');
            const files = [
              'artifacts/chat11-bounded-write-production-smoke.json',
              'artifacts/chat11-bounded-write-production-denials.json',
            ];
            const owner = process.env.BESTCODE_AUTH_TOKEN || '';
            const github = process.env.GITHUB_TOKEN || '';
            let failed = false;
            const report = (file, message) => {
              console.log('::error::' + file + ': ' + message);
              failed = true;
            };
            for (const file of files) {
              if (!fs.existsSync(file)) {
                report(file, 'required Chat 11 evidence was not produced');
                continue;
              }
              const raw = fs.readFileSync(file, 'utf8');
              if ((owner && raw.includes(owner)) || (github && raw.includes(github))) {
                report(file, 'evidence contains a protected secret value');
              }
              if (/bcwrite_v1\./i.test(raw)) report(file, 'evidence contains a bounded credential marker');
              if (/authorization/i.test(raw)) report(file, 'evidence contains a sensitive header name');
              if (/bearer\s/i.test(raw)) report(file, 'evidence contains a bearer credential marker');
              let evidence;
              try {
                evidence = JSON.parse(raw);
              } catch (error) {
                report(file, 'invalid JSON: ' + error.message);
                continue;
              }
              if (evidence.execution?.conclusion !== 'success') {
                const stage = evidence.execution?.failure?.stage ?? 'unknown';
                const message = evidence.execution?.failure?.message ?? 'no failure message';
                report(file, 'execution.conclusion=' + String(evidence.execution?.conclusion) + '; stage=' + stage + '; message=' + message);
              }
              if (evidence.security?.secret_value_persisted !== false) {
                report(file, 'security.secret_value_persisted must be false');
              }
              if (evidence.security?.sensitive_header_persisted !== false) {
                report(file, 'security.sensitive_header_persisted must be false');
              }
              if (evidence.security?.old_agent_branches_touched !== false) {
                report(file, 'security.old_agent_branches_touched must be false');
              }
            }
            if (failed) process.exit(1);
          "
          sha256sum artifacts/chat11-bounded-write-*.json > artifacts/SHA256SUMS.txt
      - name: Upload redacted immutable evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chat11-bounded-write-production-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
